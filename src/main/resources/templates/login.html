<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Welcome Back | GolfCharity</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center h-screen font-sans">
    
    <div class="w-full max-w-md px-6">
        <div class="text-center mb-10">
            <div class="inline-flex p-4 bg-indigo-600 rounded-3xl shadow-lg mb-6 text-white">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">Welcome Back, Hero</h1>
            <p class="text-slate-500 mt-2">Log in to track your rounds and support your cause[cite: 15].</p>
        </div>

        <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100">
            <div th:if="${param.error}" class="mb-6 p-4 bg-red-50 text-red-600 text-sm rounded-2xl border border-red-100 font-medium">
                Invalid email or password. Please try again.
            </div>

            <form th:action="@{/login}" method="post" class="space-y-4">
                <div>
                    <label class="block text-[10px] uppercase tracking-[0.15em] font-bold text-slate-400 mb-2 ml-1">Email Address</label>
                    <input type="email" name="username" required 
                           class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-[0.15em] font-bold text-slate-400 mb-2 ml-1">Secure Password</label>
                    <input type="password" name="password" required 
                           class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>
                
                <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-slate-800 transform active:scale-[0.98] transition-all shadow-lg mt-4">
                    Sign In to Dashboard
                </button>
            </form>
        </div>

        <div class="text-center mt-8">
            <p class="text-sm text-slate-400">Don't have a subscription? </p>
            <a href="/" class="text-indigo-600 font-bold hover:underline">View Charity Plans</a>
        </div>
    </div>

</body>
</html>

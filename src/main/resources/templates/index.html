<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Golf Charity Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <header class="py-20 bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-6 text-center">
            <h1 class="text-5xl font-bold tracking-tight text-slate-900 mb-4">
                Play Golf. Change Lives.
            </h1>
            <p class="text-xl text-slate-600 mb-8">
                Every score you enter supports a cause you care about.
            </p>
            <a href="/dashboard" class="bg-indigo-600 text-white px-8 py-3 rounded-full font-semibold hover:bg-indigo-700 transition">
                Get Started
            </a>
        </div>
    </header>

    <section class="py-16 max-w-6xl mx-auto px-6">
        <h2 class="text-3xl font-bold mb-10">Partner Charities</h2>
        <div class="grid md:grid-cols-3 gap-8">
            <div th:each="charity : ${featuredCharities}" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="text-xl font-bold mb-2" th:text="${charity.name}">Charity Name</h3>
                <p class="text-slate-500 text-sm mb-4" th:text="${charity.description}">Description goes here...</p>
                <span class="text-indigo-600 font-medium italic">Featured Partner</span>
            </div>
        </div>
    </section>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Golf Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <nav class="p-4 bg-white border-b border-slate-200 flex justify-between">
        <span class="font-bold text-indigo-600 italic">GolfCharity</span>
        <span class="text-xs text-slate-400">ID: 1 (Test User)</span>
    </nav>

    <main class="max-w-5xl mx-auto py-10 px-6">
        
        <div class="mb-8 p-8 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-[2rem] text-white shadow-xl flex items-center gap-6">
            <div class="p-4 bg-white/20 backdrop-blur-md rounded-2xl">
                <svg class="w-8 h-8 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold">Playing for Green Fairways</h1>
                <p class="text-indigo-100 opacity-90 font-medium">Every score restores 10sqft of urban forest. 🌱</p>
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-10">
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 h-fit">
                <h2 class="text-xl font-bold mb-6 text-slate-800">Enter New Score</h2>
                <form id="scoreForm" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Stableford Score (1-45)</label>
                        <input type="number" name="scoreValue" min="1" max="45" required 
                               class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Date Played</label>
                        <input type="date" name="datePlayed" required 
                               class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                    </div>
                    <button type="submit" id="submitBtn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-slate-800 transform active:scale-95 transition-all shadow-lg">
                        Submit Score
                    </button>
                </form>
            </div>

            <div class="bg-indigo-600 p-8 rounded-3xl text-white shadow-lg flex flex-col">
                <div class="flex justify-between items-center mb-8 bg-white/10 p-5 rounded-2xl border border-white/10">
                    <span class="text-[10px] uppercase tracking-widest font-black opacity-80">Your Total Impact</span>
                    <span id="charity-total" class="text-3xl font-black tabular-nums">$0.00</span>
                </div>

                <h3 class="text-lg font-bold mb-4 flex justify-between items-center">
                    Rolling 5 History
                    <span class="text-[10px] bg-indigo-500 px-2 py-1 rounded text-indigo-100 uppercase">Latest</span>
                </h3>
                
                <ul id="score-list" class="space-y-3">
                    </ul>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-4 rounded-full shadow-2xl opacity-0 transition-all duration-500 pointer-events-none font-bold">
        Score Recorded! Impact updated. 🌱
    </div>

    <script>
        const TEST_USER_ID = 1;

        // ANIMATED COUNT-UP FOR DOLLAR VALUES
        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const value = (progress * (end - start) + start).toFixed(2);
                obj.innerHTML = `$${value}`;
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        // UNIFIED DATA LOADER
        async function loadDashboardData() {
            try {
                const response = await fetch(`/api/scores/${TEST_USER_ID}`);
                if (!response.ok) throw new Error("Fetch failed");
                const scores = await response.json();
                
                const historyList = document.getElementById('score-list');
                const charityTotalElement = document.getElementById('charity-total');
                
                // 1. Calculate and Animate Total
                const oldTotal = parseFloat(charityTotalElement.innerText.replace('$', '')) || 0;
                const newTotal = scores.length * 2.00; // $2 per entry logic
                animateValue("charity-total", oldTotal, newTotal, 800);

                // 2. Clear and Populate List with staggered animation
                historyList.innerHTML = scores.length === 0 ? 
                    '<li class="text-indigo-200 text-center py-10 opacity-60 italic">No rounds recorded yet</li>' : '';

                scores.forEach((score, index) => {
                    const li = document.createElement('li');
                    li.className = "bg-white/10 p-4 rounded-2xl flex justify-between items-center transform transition-all duration-500 opacity-0 translate-y-4";
                    li.innerHTML = `
                        <div class="flex flex-col">
                            <span class="text-[10px] opacity-60 uppercase font-black tracking-tighter">Round ${scores.length - index}</span>
                            <span class="font-bold text-sm">${new Date(score.datePlayed).toLocaleDateString()}</span>
                        </div>
                        <div class="bg-white/20 px-4 py-1 rounded-xl border border-white/5">
                            <span class="text-2xl font-black">${score.scoreValue}</span>
                        </div>
                    `;
                    historyList.appendChild(li);
                    
                    // Stagger the entrance
                    setTimeout(() => {
                        li.classList.remove('opacity-0', 'translate-y-4');
                    }, index * 100);
                });
            } catch (error) {
                console.error("Dashboard Load Error:", error);
            }
        }

        // FORM SUBMISSION HANDLER
        document.getElementById("scoreForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            const toast = document.getElementById("toast");
            const formData = new FormData(e.target);

            const scoreData = {
                scoreValue: parseInt(formData.get("scoreValue")),
                datePlayed: formData.get("datePlayed"),
            };

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const response = await fetch(`/api/scores/${TEST_USER_ID}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(scoreData),
                });

                if (response.ok) {
                    e.target.reset();
                    await loadDashboardData();
                    
                    // Show Emotional Reward (Toast)
                    toast.classList.remove('opacity-0', 'translate-y-2');
                    setTimeout(() => toast.classList.add('opacity-0', 'translate-y-2'), 3000);
                } else {
                    alert("Error: " + await response.text());
                }
            } catch (err) {
                alert("Network error occurred.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Submit Score";
            }
        });

        // Initialize on Load
        window.addEventListener("DOMContentLoaded", loadDashboardData);
    </script>
</body>
</html>
